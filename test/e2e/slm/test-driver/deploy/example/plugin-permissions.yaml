# Real driver deployments must replace all occurrences of "slm-kubelet-plugin"
# with something specific to their driver.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: slm-kubelet-plugin-service-account
  namespace: slm-kubelet-plugin-namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slm-kubelet-plugin-role
rules:
- apiGroups: ["lifecycle.k8s.io"]
  resources: ["lifecycletransitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["lifecycle.k8s.io"]
  resources: ["lifecycleevents"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["lifecycle.k8s.io"]
  resources: ["lifecycleevents/status"]
  verbs: ["update", "patch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slm-kubelet-plugin-role-binding
subjects:
- kind: ServiceAccount
  name: slm-kubelet-plugin-service-account
  namespace: slm-kubelet-plugin-namespace
roleRef:
  kind: ClusterRole
  name: slm-kubelet-plugin-role
  apiGroup: rbac.authorization.k8s.io
